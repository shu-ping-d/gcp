<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris Battle Royale</title>
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        overflow: hidden;
      }
      #ui {
        margin-top: 20px;
        text-align: center;
      }
      .game-container {
        display: flex;
        gap: 40px;
        padding: 20px;
      }
      canvas {
        border: 4px solid #333;
        background-color: #000;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      .player-label {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .controls {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>TETRIS BATTLE</h1>
      <p>Clear lines to send garbage to the enemy!</p>
    </div>

    <div class="game-container">
      <div>
        <div class="player-label" style="color: #00d4ff">You (P1)</div>
        <canvas id="player" width="240" height="400"></canvas>
      </div>
      <div>
        <div class="player-label" style="color: #ff4d4d">CPU (P2)</div>
        <canvas id="enemy" width="240" height="400"></canvas>
      </div>
    </div>

    <div class="controls">
      Arrows to Move/Rotate | Down to Drop | Space to Hard Drop
    </div>

    <script>
      const canvasP1 = document.getElementById("player");
      const contextP1 = canvasP1.getContext("2d");
      const canvasP2 = document.getElementById("enemy");
      const contextP2 = canvasP2.getContext("2d");

      contextP1.scale(20, 20);
      contextP2.scale(20, 20);

      // Piece Definitions
      function createPiece(type) {
        if (type === "I")
          return [
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
          ];
        if (type === "L")
          return [
            [0, 2, 0],
            [0, 2, 0],
            [0, 2, 2],
          ];
        if (type === "J")
          return [
            [0, 3, 0],
            [0, 3, 0],
            [3, 3, 0],
          ];
        if (type === "O")
          return [
            [4, 4],
            [4, 4],
          ];
        if (type === "Z")
          return [
            [5, 5, 0],
            [0, 5, 5],
            [0, 0, 0],
          ];
        if (type === "S")
          return [
            [0, 6, 6],
            [6, 6, 0],
            [0, 0, 0],
          ];
        if (type === "T")
          return [
            [0, 7, 0],
            [7, 7, 7],
            [0, 0, 0],
          ];
      }

      function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
      }

      // Logic for Drawing
      function drawMatrix(ctx, matrix, offset, isGhost = false) {
        const colors = [
          null,
          "#00f0f0",
          "#f0a000",
          "#0000f0",
          "#f0f000",
          "#f00000",
          "#00f000",
          "#a000f0",
          "#555",
        ];
        matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              ctx.fillStyle = isGhost ? "rgba(255,255,255,0.2)" : colors[value];
              ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
              ctx.lineWidth = 0.05;
              ctx.strokeStyle = "#000";
              ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
            }
          });
        });
      }

      function draw(canvas, ctx, player) {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Ghost
        const ghostPos = findGhostPos(player);
        drawMatrix(ctx, player.matrix, ghostPos, true);

        drawMatrix(ctx, player.arena, { x: 0, y: 0 });
        drawMatrix(ctx, player.matrix, player.pos);
      }

      // Collision & Movement
      function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
          for (let x = 0; x < m[y].length; ++x) {
            if (
              m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0
            )
              return true;
          }
        }
        return false;
      }

      function merge(arena, player) {
        player.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
          });
        });
      }

      function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
          for (let x = 0; x < y; ++x)
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
        if (dir > 0) matrix.forEach((row) => row.reverse());
        else matrix.reverse();
      }

      // Battle Mechanics: Garbage
      function arenaSweep(player, targetPlayer) {
        let rowCount = 0;
        outer: for (let y = player.arena.length - 1; y > 0; --y) {
          for (let x = 0; x < player.arena[y].length; ++x) {
            if (player.arena[y][x] === 0) continue outer;
          }
          const row = player.arena.splice(y, 1)[0].fill(0);
          player.arena.unshift(row);
          ++y;
          rowCount++;
        }
        if (rowCount > 1) {
          sendGarbage(targetPlayer, rowCount - 1);
        }
      }

      function sendGarbage(target, lines) {
        for (let i = 0; i < lines; i++) {
          const row = new Array(12).fill(8); // 8 is grey garbage color
          const hole = Math.floor(Math.random() * 12);
          row[hole] = 0;
          target.arena.shift();
          target.arena.push(row);
        }
      }

      function findGhostPos(player) {
        const pos = { x: player.pos.x, y: player.pos.y };
        while (!collide(player.arena, { pos, matrix: player.matrix })) {
          pos.y++;
        }
        pos.y--;
        return pos;
      }

      // Game State Factories
      function createPlayerData(targetArena) {
        return {
          pos: { x: 0, y: 0 },
          matrix: null,
          arena: createMatrix(12, 20),
          dropCounter: 0,
          dropInterval: 1000,
          target: targetArena,
        };
      }

      const p1 = createPlayerData();
      const p2 = createPlayerData();
      p1.target = p2;
      p2.target = p1;

      function playerReset(player) {
        const pieces = "ILJOTSZ";
        player.matrix = createPiece(
          pieces[(pieces.length * Math.random()) | 0],
        );
        player.pos.y = 0;
        player.pos.x =
          ((player.arena[0].length / 2) | 0) -
          ((player.matrix[0].length / 2) | 0);
        if (collide(player.arena, player)) {
          player.arena.forEach((row) => row.fill(0));
          alert("Game Over! Resetting...");
        }
      }

      function playerDrop(player, target) {
        player.pos.y++;
        if (collide(player.arena, player)) {
          player.pos.y--;
          merge(player.arena, player);
          playerReset(player);
          arenaSweep(player, target);
        }
        player.dropCounter = 0;
      }

      function playerMove(player, dir) {
        player.pos.x += dir;
        if (collide(player.arena, player)) player.pos.x -= dir;
      }

      // Basic AI for the enemy
      function updateAI(time) {
        p2.dropCounter += time;
        if (p2.dropCounter > p2.dropInterval) {
          playerDrop(p2, p1);
        }
        // Randomly move and rotate for "AI" feel
        if (Math.random() > 0.98) playerMove(p2, Math.random() > 0.5 ? 1 : -1);
      }

      let lastTime = 0;
      function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        p1.dropCounter += deltaTime;
        if (p1.dropCounter > p1.dropInterval) {
          playerDrop(p1, p2);
        }

        updateAI(deltaTime);

        draw(canvasP1, contextP1, p1);
        draw(canvasP2, contextP2, p2);
        requestAnimationFrame(update);
      }

      document.addEventListener("keydown", (event) => {
        if (event.keyCode === 37) playerMove(p1, -1);
        else if (event.keyCode === 39) playerMove(p1, 1);
        else if (event.keyCode === 40) playerDrop(p1, p2);
        else if (event.keyCode === 38) {
          rotate(p1.matrix, 1);
          if (collide(p1.arena, p1)) rotate(p1.matrix, -1);
        } else if (event.keyCode === 32) {
          // Space for Hard Drop
          while (!collide(p1.arena, p1)) {
            p1.pos.y++;
          }
          p1.pos.y--;
          merge(p1.arena, p1);
          playerReset(p1);
          arenaSweep(p1, p2);
        }
      });

      playerReset(p1);
      playerReset(p2);
      update();
    </script>
  </body>
</html>
